name: CDN Backfill

# Restores pf release files in R2 from GitHub Releases. scripts/backfill-release.sh
# verifies every minisign signature against src/core/upgrade/release_keys.zig and
# uploads through scripts/publish-release.sh, with the paths and headers that
# release.yml uses. The default run is a dry run that writes nothing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to backfill (e.g. "v0.3.0") or "all" for every release'
        required: true
        default: "all"
      update-latest:
        description: "Point latest.txt at the newest release when it is backfilled and verified"
        type: boolean
        default: false
      dry-run:
        description: "Download and verify, list the uploads, and write nothing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install minisign and rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign rclone

      # The R2 token is an environment secret of release, scoped to Object
      # Read & Write on the pf release bucket only.
      - name: Backfill R2 from GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ inputs.version }}
          UPDATE_LATEST: ${{ inputs.update-latest }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          if [[ "$UPDATE_LATEST" == true ]]; then args+=(--update-latest); fi
          scripts/backfill-release.sh "${args[@]}" "$VERSION"
