name: Release

on:
  # Manual dispatch only until the first release. An automatic trigger returns
  # only through the go-live checklist (US-018 in tasks/prd-pf-distribution.md).
  # Publishing also needs validate_only disabled and an approval of the
  # release environment; the default run signs and verifies without publishing.
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build, sign, verify, and attest every platform, and dry-run the publication
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  check-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check if release needed
        id: check
        env:
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only }}
        run: |
          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::src/main.zig version is not strict SemVer"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if [[ "$VALIDATE_ONLY" == true ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Validating release artifacts without publishing"
          elif git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} exists, no release needed"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} missing, release needed"
          fi

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}

      - name: Package
        run: |
          python3 -c 'import pathlib; n = pathlib.Path("zig-out/bin/pf").stat().st_size; print(f"linux executable: {n:,} bytes ({n / 1048576:.6f} MiB)")' >> "$GITHUB_STEP_SUMMARY"
          package_dir="$RUNNER_TEMP/pf-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/pf LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf pf-${{ matrix.name }}.tar.gz -C "$package_dir" pf LICENSE THIRD_PARTY_NOTICES.md
          sha256sum pf-${{ matrix.name }}.tar.gz > pf-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pf-${{ matrix.name }}
          path: |
            pf-${{ matrix.name }}.tar.gz
            pf-${{ matrix.name }}.tar.gz.sha256

  build-macos-x86_64:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build macos-x86_64
    runs-on: macos-15-intel
    environment: apple-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-macos

      - name: Sign and notarize
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/sign-and-notarize-macos.sh zig-out/bin/pf

      - name: Verify notarized Intel binary
        if: github.event_name == 'workflow_dispatch' && inputs.validate_only
        run: |
          codesign --verify --strict --check-notarization -R=notarized ./zig-out/bin/pf
          ./zig-out/bin/pf --version
          ./zig-out/bin/pf help

      - name: Package
        run: |
          python3 -c 'import pathlib; n = pathlib.Path("zig-out/bin/pf").stat().st_size; print(f"macOS Intel signed executable: {n:,} bytes ({n / 1048576:.6f} MiB)")' >> "$GITHUB_STEP_SUMMARY"
          package_dir="$RUNNER_TEMP/pf-package-macos-x86_64"
          mkdir -p "$package_dir"
          cp zig-out/bin/pf LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf pf-macos-x86_64.tar.gz -C "$package_dir" pf LICENSE THIRD_PARTY_NOTICES.md
          shasum -a 256 pf-macos-x86_64.tar.gz > pf-macos-x86_64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pf-macos-x86_64
          path: |
            pf-macos-x86_64.tar.gz
            pf-macos-x86_64.tar.gz.sha256

  build-macos-arm64:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/pgso-macos-arm64.yml

  sign-macos-arm64:
    needs: [check-version, build-macos-arm64]
    if: needs.check-version.outputs.needed == 'true'
    name: Sign macos-arm64
    runs-on: macos-15
    environment: apple-signing
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require native arm64 host
        run: test "$(uname -m)" = arm64

      - name: Download eligible candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build-macos-arm64.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/pf-pgso-aggregate

      - name: Restore executable mode
        run: chmod +x "$RUNNER_TEMP/pf-pgso-aggregate/candidate/pf"

      - name: Confirm release eligibility
        run: python3 -m scripts.pgso report --output-dir "$RUNNER_TEMP/pf-pgso-aggregate" >/dev/null

      - name: Sign and notarize stable release candidate
        env:
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ "$VALIDATE_ONLY" == true ]]; then
            control_dir="$RUNNER_TEMP/pf-signing-control"
            mkdir -p "$control_dir"
            cp "$RUNNER_TEMP/pf-pgso-aggregate/candidate/pf" "$control_dir/pf"
            scripts/sign-and-notarize-macos.sh "$control_dir/pf" 4096
            scripts/sign-and-notarize-macos.sh "$RUNNER_TEMP/pf-pgso-aggregate/candidate/pf" 16384
          else
            scripts/sign-and-notarize-macos.sh "$RUNNER_TEMP/pf-pgso-aggregate/candidate/pf"
          fi

      - name: Verify notarized arm64 binaries
        if: github.event_name == 'workflow_dispatch' && inputs.validate_only
        run: |
          for binary in "$RUNNER_TEMP/pf-signing-control/pf" "$RUNNER_TEMP/pf-pgso-aggregate/candidate/pf"; do
            codesign --verify --strict --check-notarization -R=notarized "$binary"
            "$binary" --version
            "$binary" help
            python3 -c 'import pathlib, sys; n = pathlib.Path(sys.argv[1]).stat().st_size; print(f"{sys.argv[1]}: {n:,} bytes ({n / 1048576:.6f} MiB)")' "$binary" >> "$GITHUB_STEP_SUMMARY"
            shasum -a 256 "$binary" >> "$GITHUB_STEP_SUMMARY"
          done
          tar -czf "$RUNNER_TEMP/pf-signing-control.tar.gz" -C "$RUNNER_TEMP/pf-signing-control" pf

      - name: Upload arm64 signing control
        if: github.event_name == 'workflow_dispatch' && inputs.validate_only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signing-control-macos-arm64
          path: ${{ runner.temp }}/pf-signing-control.tar.gz
          if-no-files-found: error

      - name: Package stable release candidate
        run: |
          archive="$RUNNER_TEMP/pf-macos-aarch64.tar.gz"
          package_dir="$RUNNER_TEMP/pf-release-package"
          mkdir -p "$package_dir"
          cp "$RUNNER_TEMP/pf-pgso-aggregate/candidate/pf" LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf "$archive" -C "$package_dir" pf LICENSE THIRD_PARTY_NOTICES.md
          cd "$RUNNER_TEMP"
          shasum -a 256 pf-macos-aarch64.tar.gz > pf-macos-aarch64.tar.gz.sha256

      - name: Upload stable release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pf-macos-aarch64
          path: |
            ${{ runner.temp }}/pf-macos-aarch64.tar.gz
            ${{ runner.temp }}/pf-macos-aarch64.tar.gz.sha256
          if-no-files-found: error

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.needed == 'true'
    name: Build windows-x86_64
    runs-on: windows-2025
    environment: windows-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-gnu -Dupdate-channel=stable

      # Azure Artifact Signing account strivex-signing, certificate profile
      # StriveX-Release. The script verifies with signtool verify /pa and
      # requires O=Strivex in the signer subject.
      - name: Sign
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERT_PROFILE }}
        run: ./scripts/sign-windows.ps1 -InputFile zig-out/bin/pf.exe

      - name: Smoke test signed binary
        shell: bash
        run: |
          ./zig-out/bin/pf.exe help >/dev/null
          ./zig-out/bin/pf.exe status --json >/dev/null

      - name: Package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'pf-package-windows-x86_64'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath zig-out/bin/pf.exe, LICENSE, THIRD_PARTY_NOTICES.md -Destination $packageDir
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath pf-windows-x86_64.zip
          $hash = (Get-FileHash -LiteralPath pf-windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $PWD 'pf-windows-x86_64.zip.sha256'), "$hash  pf-windows-x86_64.zip`n")
          $size = (Get-Item -LiteralPath zig-out/bin/pf.exe).Length
          "Windows signed executable: $($size.ToString('N0')) bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pf-windows-x86_64
          path: |
            pf-windows-x86_64.zip
            pf-windows-x86_64.zip.sha256
          if-no-files-found: error

  sign-release:
    needs: [check-version, build-linux, build-macos-x86_64, sign-macos-arm64, build-windows]
    if: needs.check-version.outputs.needed == 'true'
    name: Sign and attest archives
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pf-*
          merge-multiple: true
          path: release

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign and verify archives with minisign
        id: minisign
        env:
          PF_MINISIGN_SECRET_KEY: ${{ secrets.PF_MINISIGN_SECRET_KEY }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: scripts/sign-release-archives.sh "$VERSION" stable release/pf-*.tar.gz release/pf-*.zip

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/pf-*.tar.gz
            release/pf-*.zip
            release/pf-*.minisig

      - name: Dry-run the publication
        if: github.event_name == 'workflow_dispatch' && inputs.validate_only
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -o pipefail
          scripts/publish-release.sh --dry-run "$VERSION" release | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload signed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-signed
          path: release/
          if-no-files-found: error

      - name: Name the failed step
        if: failure()
        env:
          MINISIGN_OUTCOME: ${{ steps.minisign.outcome }}
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
        run: |
          if [[ "$MINISIGN_OUTCOME" == failure ]]; then
            echo "### Failed step: Sign and verify archives with minisign. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$ATTEST_OUTCOME" == failure ]]; then
            echo "### Failed step: Attest build provenance. Nothing was published." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: [check-version, sign-release]
    if: needs.check-version.outputs.publish == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.validate_only)
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download signed release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-signed
          path: release

      - name: Create git tag
        env:
          RELEASE_TAG: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git tag -- "$RELEASE_TAG"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Extract changelog entry
        run: |
          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > /tmp/release-notes.md
          LINES=$(wc -l < /tmp/release-notes.md | tr -d ' ')
          if [ "$LINES" -lt 2 ]; then
            echo "Error: No release notes found between <!-- release:start --> and <!-- release:end --> markers in CHANGELOG.md"
            exit 1
          fi
          echo "Extracted release notes ($LINES lines)"

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      # The R2 token is an environment secret of release, scoped to Object
      # Read & Write on the pf release bucket only.
      - name: Publish to GitHub Releases and R2
        env:
          GH_TOKEN: ${{ github.token }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: scripts/publish-release.sh "$VERSION" release /tmp/release-notes.md
