name: Full CI

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  native:
    name: Native checks (${{ matrix.optimize }}, ${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-x86_64
            runner: macos-15-intel
          - name: macos-aarch64
            runner: macos-15
        optimize: [ReleaseSafe]
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: full-ci-native-${{ matrix.platform.name }}-${{ matrix.optimize }}

      - name: Check formatting
        run: zig fmt --check src/

      - name: Audit public surface
        run: ./scripts/check-public-surface.sh

      - name: Check compactor boundary
        run: ./scripts/check-compactor-boundary.sh

      - name: Test signing and release routing
        run: python3 -m unittest scripts.tests.test_macos_signing scripts.tests.test_signed_macos scripts.tests.test_sign_release_archives scripts.tests.test_publish_release scripts.tests.test_prepare_release -q

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Run unit tests
        run: zig build test -Doptimize=${{ matrix.optimize }}

      - name: Smoke test fresh binary
        shell: bash
        run: |
          help_stdout="$(mktemp)"
          help_stderr="$(mktemp)"
          status_stdout="$(mktemp)"
          status_stderr="$(mktemp)"
          trap 'rm -f "$help_stdout" "$help_stderr" "$status_stdout" "$status_stderr"' EXIT

          ./zig-out/bin/pf help >"$help_stdout" 2>"$help_stderr"
          test -s "$help_stdout"
          test ! -s "$help_stderr"

          ./zig-out/bin/pf status --json >"$status_stdout" 2>"$status_stderr"
          test -s "$status_stdout"
          test ! -s "$status_stderr"

  windows:
    name: Native checks (ReleaseSafe, windows-x86_64)
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          cache-key: full-ci-native-windows-x86_64-ReleaseSafe

      - name: Check formatting
        run: zig fmt --check src/

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Run unit tests
        run: |
          set -o pipefail
          if ! zig build test -Doptimize=ReleaseSafe --test-timeout 120s 2>&1 | tee "$RUNNER_TEMP/unit-tests.log"; then
            {
              echo "### Failed step: Run unit tests"
              grep -E "^error: '" "$RUNNER_TEMP/unit-tests.log" | head -100 | sed 's/^error: /- /'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Smoke test fresh binary
        run: |
          fail() {
            printf '### Failed step: Smoke test fresh binary\n- %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          ./zig-out/bin/pf.exe help >"$RUNNER_TEMP/help.out" 2>"$RUNNER_TEMP/help.err" || fail "pf.exe help exited nonzero"
          test -s "$RUNNER_TEMP/help.out" || fail "pf.exe help printed nothing"
          test ! -s "$RUNNER_TEMP/help.err" || fail "pf.exe help wrote to stderr"
          ./zig-out/bin/pf.exe status --json >"$RUNNER_TEMP/status.out" 2>"$RUNNER_TEMP/status.err" || fail "pf.exe status --json exited nonzero"
          test -s "$RUNNER_TEMP/status.out" || fail "pf.exe status --json printed nothing"
          test ! -s "$RUNNER_TEMP/status.err" || fail "pf.exe status --json wrote to stderr"

      - name: Build ConPTY driver
        run: zig build conpty-driver -Doptimize=ReleaseSafe

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile
        working-directory: tests/e2e

      - name: Run Windows E2E subset
        run: bun windows-subset.ts
        working-directory: tests/e2e

  full-suite-windows:
    name: Full suite (windows-x86_64)
    if: ${{ always() }}
    needs:
      - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify Windows checks
        env:
          RESULT: ${{ needs.windows.result }}
        run: test "$RESULT" = "success"

  e2e:
    name: E2E (${{ matrix.optimize }}, ${{ matrix.platform.name }}, shard ${{ matrix.shard.label }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            runner: ubuntu-24.04
            zig_tarball: zig-x86_64-linux
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            zig_tarball: zig-aarch64-linux
          - name: macos-x86_64
            runner: macos-15-intel
            zig_tarball: zig-x86_64-macos
          - name: macos-aarch64
            runner: macos-15
            zig_tarball: zig-aarch64-macos
        optimize: [ReleaseSafe]
        shard:
          - index: 0
            shard_count: 4
            label: "1/4"
          - index: 1
            shard_count: 4
            label: "2/4"
          - index: 2
            shard_count: 4
            label: "3/4"
          - index: 3
            shard_count: 4
            label: "4/4"
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
      PF_REQUIRE_TMUX: "1"
      SHARD_INDEX: ${{ matrix.shard.index }}
      SHARD_COUNT: ${{ matrix.shard.shard_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"
          use-cache: false

      - name: Restore native Zig cache
        uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: full-ci-e2e-read-only-${{ matrix.platform.name }}-${{ matrix.optimize }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            setup-zig-cache-v2-native-${{ matrix.platform.zig_tarball }}-0.16.0-full-ci-native-${{ matrix.platform.name }}-${{ matrix.optimize }}-

      - name: Build
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install E2E system dependencies
        shell: bash
        timeout-minutes: 17
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            missing=()
            command -v tmux >/dev/null 2>&1 || missing+=(tmux)
            command -v zsh >/dev/null 2>&1 || missing+=(zsh)
            if [ "${#missing[@]}" -gt 0 ]; then
              retry() {
                local attempt
                for attempt in 1 2; do
                  if "$@"; then
                    return 0
                  fi
                  if [ "$attempt" -lt 2 ]; then
                    printf 'Dependency install attempt %s failed; retrying in 5s\n' "$attempt" >&2
                    sleep 5
                  fi
                done
                return 1
              }
              # The Azure mirror can stall after APT has already fetched release
              # metadata from the direct Ubuntu fallback. Prefer that fallback
              # for the whole update when the runner's mirror list provides it.
              if [ -f /etc/apt/apt-mirrors.txt ] &&
                grep -Eq '^https?://(archive|ports)\.ubuntu\.com/' /etc/apt/apt-mirrors.txt
              then
                sudo sed -i '/:\/\/azure\..*ubuntu\.com\//d' /etc/apt/apt-mirrors.txt
              fi
              retry sudo timeout --kill-after=15s 4m apt-get \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                update
              retry sudo timeout --kill-after=15s 3m apt-get \
                -o Dpkg::Use-Pty=0 \
                install -y "${missing[@]}"
            fi
          elif ! command -v tmux >/dev/null 2>&1; then
            brew install tmux
          fi
          printf 'set-option -g history-limit 100000\n' > "$HOME/.tmux.conf"
          tmux -V
          zsh --version

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile
        working-directory: tests/e2e

      - name: Run deterministic E2E shard
        shell: bash
        working-directory: tests/e2e
        run: |
          selected=()
          selection_file="$RUNNER_TEMP/pf-e2e-shard-${SHARD_INDEX}.txt"
          bun ci-shards.ts \
            --shard-count "$SHARD_COUNT" \
            --shard-index "$SHARD_INDEX" > "$selection_file"
          while IFS= read -r test_file; do
            selected+=("$test_file")
          done < "$selection_file"

          test "${#selected[@]}" -gt 0
          printf 'Running E2E shard %s/%s (%s files):\n' "$((SHARD_INDEX + 1))" "$SHARD_COUNT" "${#selected[@]}"
          printf '  %s\n' "${selected[@]}"

          shard_status=0
          test_number=0
          for test_file in "${selected[@]}"; do
            tmux_tmp_dir="$RUNNER_TEMP/pf-e2e-tmux-${SHARD_INDEX}-${test_number}"
            mkdir -p "$tmux_tmp_dir"
            if ! TMUX_TMPDIR="$tmux_tmp_dir" bun test --max-concurrency 1 "./$test_file"; then
              printf 'Retrying failed E2E file after resetting tmux: %s\n' "$test_file"
              TMUX_TMPDIR="$tmux_tmp_dir" tmux kill-server 2>/dev/null || true
              if ! TMUX_TMPDIR="$tmux_tmp_dir" bun test --max-concurrency 1 "./$test_file"; then
                shard_status=1
              fi
            fi
            TMUX_TMPDIR="$tmux_tmp_dir" tmux kill-server 2>/dev/null || true
            test_number=$((test_number + 1))
          done
          exit "$shard_status"

  full-suite:
    name: Full suite (${{ matrix.name }})
    if: ${{ always() }}
    needs:
      - native
      - e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        name:
          - linux-x86_64
          - linux-aarch64
          - macos-x86_64
          - macos-aarch64
    steps:
      - name: Verify native and E2E matrices
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.name }}
        run: |
          jobs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100")"
          jq -e --arg target "$TARGET" '
            ([
              "Native checks (ReleaseSafe, " + $target + ")",
              (range(1; 5) as $shard
                | "E2E (ReleaseSafe, " + $target + ", shard " + ($shard | tostring) + "/4)")
            ] | sort) as $expected
            |
            [
              .jobs[]
              | select(
                  (.name == ("Native checks (ReleaseSafe, " + $target + ")")) or
                  (.name | startswith("E2E (ReleaseSafe, " + $target + ", shard "))
              )
            ] as $selected
            | (($selected | map(.name) | sort) == $expected and
               all($selected[]; .conclusion == "success"))
          ' <<< "$jobs"
