name: Dev Release

on:
  # Manual dispatch only until the first release. The automatic trigger after a
  # successful CI run on main returns only through the go-live checklist
  # (US-018 in tasks/prd-pf-distribution.md). The default run builds, signs,
  # and verifies every dev archive and logs its planned uploads without writing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign, and verify every dev archive, and dry-run the publication
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.metadata.outputs.dry_run }}
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve commit and version
        id: metadata
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::src/main.zig version is not strict SemVer"
            exit 1
          fi
          if [[ "$DRY_RUN" != true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Dev builds publish only from main"
            exit 1
          fi
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-linux
          - name: linux-aarch64
            target: aarch64-linux
          - name: macos-x86_64
            target: x86_64-macos
          - name: macos-aarch64
            target: aarch64-macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build dev binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -Dupdate-channel=dev

      - name: Package
        run: |
          package_dir="$RUNNER_TEMP/pf-package-${{ matrix.name }}"
          mkdir -p "$package_dir"
          cp zig-out/bin/pf LICENSE THIRD_PARTY_NOTICES.md "$package_dir/"
          tar -czf pf-${{ matrix.name }}.tar.gz -C "$package_dir" pf LICENSE THIRD_PARTY_NOTICES.md
          sha256sum pf-${{ matrix.name }}.tar.gz > pf-${{ matrix.name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pf-${{ matrix.name }}
          path: |
            pf-${{ matrix.name }}.tar.gz
            pf-${{ matrix.name }}.tar.gz.sha256

  # Dev builds carry minisign signatures only: no Azure signing of pf.exe.
  build-windows:
    needs: metadata
    name: Build windows-x86_64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      - name: Build dev binary
        run: zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-gnu -Dupdate-channel=dev

      - name: Smoke test dev binary
        shell: bash
        run: |
          ./zig-out/bin/pf.exe help >/dev/null
          ./zig-out/bin/pf.exe status --json >/dev/null

      - name: Package
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:RUNNER_TEMP 'pf-package-windows-x86_64'
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath zig-out/bin/pf.exe, LICENSE, THIRD_PARTY_NOTICES.md -Destination $packageDir
          Compress-Archive -Path (Join-Path $packageDir '*') -DestinationPath pf-windows-x86_64.zip
          $hash = (Get-FileHash -LiteralPath pf-windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $PWD 'pf-windows-x86_64.zip.sha256'), "$hash  pf-windows-x86_64.zip`n")

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pf-windows-x86_64
          path: |
            pf-windows-x86_64.zip
            pf-windows-x86_64.zip.sha256
          if-no-files-found: error

  sign:
    needs: [metadata, build, build-windows]
    name: Sign dev archives
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pf-*
          merge-multiple: true
          path: release

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign and verify archives with minisign
        env:
          PF_MINISIGN_SECRET_KEY: ${{ secrets.PF_MINISIGN_SECRET_KEY }}
          SHA: ${{ needs.metadata.outputs.sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: scripts/sign-release-archives.sh --commit "$SHA" "$VERSION" dev release/pf-*.tar.gz release/pf-*.zip

      - name: Dry-run the publication
        if: needs.metadata.outputs.dry_run == 'true'
        env:
          SHA: ${{ needs.metadata.outputs.sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -o pipefail
          scripts/publish-release.sh --dev --dry-run "$VERSION" "$SHA" release | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload signed dev build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-signed
          path: release/
          if-no-files-found: error

  publish:
    needs: [metadata, sign]
    if: needs.metadata.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}

      - name: Download signed dev build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dev-signed
          path: release

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      # dev.json moves to this build only while main still points at it, and
      # retention keeps the newest 30 dev builds and the one dev.json names.
      - name: Publish to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SHA: ${{ needs.metadata.outputs.sha }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: scripts/publish-release.sh --dev "$VERSION" "$SHA" release
